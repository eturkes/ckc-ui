<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CKC one-shot workbench</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="mark">CKC</div>
        <div>
          <h1>One-shot M1-M2 evidence workbench</h1>
          <p id="run-subtitle">Loading run data</p>
        </div>
      </div>
      <div class="status-strip" id="status-strip"></div>
    </header>

    <div class="workspace">
      <nav class="rail" aria-label="Workbench sections">
        <button class="rail-item is-active" data-section="overview">Run</button>
        <button class="rail-item" data-section="spine">M1 spine</button>
        <button class="rail-item" data-section="trace">Trace</button>
        <button class="rail-item" data-section="lift">M2 lift</button>
        <button class="rail-item" data-section="io">Model I/O</button>
        <button class="rail-item" data-section="reports">Reports</button>
        <button class="rail-item" data-section="artifacts">Artifacts</button>
      </nav>
      <main class="main" id="main" tabindex="-1"></main>
    </div>
  </div>
  <script src="./run-data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
