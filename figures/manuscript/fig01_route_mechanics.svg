<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Route mechanics and evidence boundaries</title>
  <desc id="desc">Route mechanics. Implemented routes consume the same fixture groups and are scored by the same evaluator; the current run shows a target-syntax baseline delta only, not an admitted-verdict baseline delta.</desc>
  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="54" y="58" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#111827" text-anchor="start">Route mechanics and evidence boundaries</text>
  <text x="54" y="92" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#596273" text-anchor="start">The route matrix compares baseline target emission with route outputs over identical fixture groups.</text>
  <text x="1546" y="58" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#596273" text-anchor="end">run m3-routes</text>
  <rect x="70" y="150" width="285" height="170" rx="8" fill="#ffffff" stroke="#355c9a" stroke-width="3"/>
  <text x="88" y="182" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111827" text-anchor="start">Fixture evidence</text>
  <rect x="273" y="164" width="67.2" height="28" rx="12" fill="#eef3fb" stroke="#b8c8e6" stroke-width="1"/>
  <text x="285" y="183" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#355c9a" text-anchor="start">input</text>
  <text x="88" y="216" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#596273" text-anchor="start">Groups: M2 holdout: 1; M3</text>
  <text x="88" y="239" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#596273" text-anchor="start">expanded: 5; M3</text>
  <text x="88" y="262" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#596273" text-anchor="start">metamorphic: 2; M1: 2.</text>
  <text x="88" y="285" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#596273" text-anchor="start">Gold verdicts and source</text>
  <text x="88" y="308" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#596273" text-anchor="start">spans remain fixed.</text>
  <rect x="455" y="150" width="285" height="170" rx="8" fill="#ffffff" stroke="#2f6b4f" stroke-width="3"/>
  <text x="473" y="182" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111827" text-anchor="start">Shared cue layer</text>
  <rect x="666" y="164" width="49.92" height="28" rx="12" fill="#eaf4ee" stroke="#b9d6c5" stroke-width="1"/>
  <text x="678" y="183" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#2f6b4f" text-anchor="start">det</text>
  <text x="473" y="216" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#596273" text-anchor="start">lexical_cue_v1 derives</text>
  <text x="473" y="239" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#596273" text-anchor="start">source cues for evaluator</text>
  <text x="473" y="262" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#596273" text-anchor="start">grounding.</text>
  <text x="473" y="285" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#596273" text-anchor="start">The cue layer is experiment</text>
  <text x="473" y="308" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#596273" text-anchor="start">scaffolding.</text>
  <line x1="355" y1="235" x2="455" y2="235" stroke="#596273" stroke-width="2"/>
  <polygon points="455,235 444.608,241 444.608,229" fill="#596273" stroke="none"/>
  <rect x="845" y="120" width="310" height="190" rx="8" fill="#ffffff" stroke="#b45c37" stroke-width="3"/>
  <text x="863" y="152" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111827" text-anchor="start">Direct route</text>
  <rect x="1079" y="134" width="49.92" height="28" rx="12" fill="#fff0e8" stroke="#e5b69d" stroke-width="1"/>
  <text x="1091" y="153" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#b45c37" text-anchor="start">LLM</text>
  <text x="863" y="186" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#596273" text-anchor="start">The model emits one SMT-LIB</text>
  <text x="863" y="209" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#596273" text-anchor="start">target.</text>
  <text x="863" y="232" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#596273" text-anchor="start">Target syntax: 1/4.</text>
  <text x="863" y="255" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#596273" text-anchor="start">Admission: 0/4.</text>
  <rect x="845" y="390" width="310" height="205" rx="8" fill="#ffffff" stroke="#1f6f8b" stroke-width="3"/>
  <text x="863" y="422" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111827" text-anchor="start">Compiled route</text>
  <rect x="1037" y="404" width="101.76" height="28" rx="12" fill="#e8f5f8" stroke="#a9cfda" stroke-width="1"/>
  <text x="1049" y="423" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1f6f8b" text-anchor="start">LLM + det</text>
  <text x="863" y="456" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#596273" text-anchor="start">single_ir emits an</text>
  <text x="863" y="479" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#596273" text-anchor="start">intermediate route artifact.</text>
  <text x="863" y="502" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#596273" text-anchor="start">4 rows compile to 6 SMT</text>
  <text x="863" y="525" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#596273" text-anchor="start">file(s).</text>
  <text x="863" y="548" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#596273" text-anchor="start">Target syntax: 4/4.</text>
  <line x1="740" y1="235" x2="845" y2="212" stroke="#596273" stroke-width="2"/>
  <polygon points="845,212 836.132,220.085 833.565,208.363" fill="#596273" stroke="none"/>
  <line x1="740" y1="235" x2="845" y2="492" stroke="#596273" stroke-width="2"/>
  <polygon points="845,492 835.515,484.649 846.624,480.11" fill="#596273" stroke="none"/>
  <rect x="1260" y="120" width="270" height="190" rx="8" fill="#ffffff" stroke="#c8d0da" stroke-width="3"/>
  <text x="1278" y="152" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111827" text-anchor="start">Target checks</text>
  <rect x="1452" y="134" width="58.56" height="28" rx="12" fill="#f5f7fa" stroke="#c8d0da" stroke-width="1"/>
  <text x="1464" y="153" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#596273" text-anchor="start">gate</text>
  <text x="1278" y="186" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#596273" text-anchor="start">Syntactic target checks</text>
  <text x="1278" y="209" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#596273" text-anchor="start">and route admission run</text>
  <text x="1278" y="232" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#596273" text-anchor="start">before accuracy claims.</text>
  <text x="1278" y="255" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#596273" text-anchor="start">Admitted accuracy: 0/4.</text>
  <rect x="1260" y="390" width="270" height="205" rx="8" fill="#ffffff" stroke="#2f6b4f" stroke-width="3"/>
  <text x="1278" y="422" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111827" text-anchor="start">Compiler gate</text>
  <rect x="1456" y="404" width="49.92" height="28" rx="12" fill="#eaf4ee" stroke="#b9d6c5" stroke-width="1"/>
  <text x="1468" y="423" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#2f6b4f" text-anchor="start">det</text>
  <text x="1278" y="456" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#596273" text-anchor="start">Complete IR rows compile</text>
  <text x="1278" y="479" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#596273" text-anchor="start">to SMT-LIB and are scored</text>
  <text x="1278" y="502" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#596273" text-anchor="start">by the same evaluator.</text>
  <text x="1278" y="525" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#596273" text-anchor="start">Admission: 0/4.</text>
  <line x1="1155" y1="212" x2="1260" y2="212" stroke="#596273" stroke-width="2"/>
  <polygon points="1260,212 1249.608,218 1249.608,206" fill="#596273" stroke="none"/>
  <line x1="1155" y1="492" x2="1260" y2="492" stroke="#596273" stroke-width="2"/>
  <polygon points="1260,492 1249.608,498 1249.608,486" fill="#596273" stroke="none"/>
  <rect x="70" y="665" width="1460" height="110" rx="8" fill="#fbfcfd" stroke="#e5e9ef" stroke-width="2"/>
  <text x="96" y="705" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111827" text-anchor="start">Route matrix result</text>
  <text x="96" y="735" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#111827" text-anchor="start">The route matrix keeps route.direct_smt as baseline. Highest target syntax is ckc_layered at 4/4; candidate accuracy remains rejected-output</text>
  <text x="96" y="760" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#111827" text-anchor="start">audit evidence.</text>
  <line x1="54" y1="844" x2="1546" y2="844" stroke="#e5e9ef" stroke-width="1"/>
  <text x="54" y="868" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#596273" text-anchor="start">Scope: research harness,source-grounded,schema-valid,verifier-checked,replayable,locked measurement,synthetic fixture measurement,real guideline source intake candidate,documented null</text>
  <text x="54" y="888" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#596273" text-anchor="start">result; scaffolded_cue_translation_test. This figure makes no clinical, patient-care, deployment, or regulatory claim.</text>
</svg>
