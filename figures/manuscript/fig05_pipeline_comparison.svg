  <text x="1160" y="668" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="14" font-weight="700" fill="#b45c37" text-anchor="middle">0/20</text>
  <line x1="120" y1="170" x2="466.667" y2="170" stroke="#2f6b4f" stroke-width="3" stroke-dasharray="9 6"/>
  <line x1="466.667" y1="170" x2="813.333" y2="170" stroke="#2f6b4f" stroke-width="3" stroke-dasharray="9 6"/>
