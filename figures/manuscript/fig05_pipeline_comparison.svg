  <text x="466.667" y="203" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="14" font-weight="700" fill="#2f6b4f" text-anchor="middle">10/10</text>
  <polygon points="813.333,164 819.333,170 813.333,176 807.333,170" fill="#2f6b4f" stroke="none"/>
  <text x="813.333" y="203" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="14" font-weight="700" fill="#2f6b4f" text-anchor="middle">10/10</text>
