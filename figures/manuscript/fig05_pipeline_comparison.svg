<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Deterministic pipeline comparison</title>
  <desc id="desc">Deterministic pipeline comparison. Direct rule-to-SMT is retained as baseline; the layered CKC pipeline matches verdict and conflict-kind accuracy in the current M3 comparison while component reuse is reported separately from model-route lift.</desc>
  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="54" y="58" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#111827" text-anchor="start">Deterministic pipeline comparison</text>
  <text x="54" y="92" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#596273" text-anchor="start">Layered CKC artifacts are compared with direct rule-to-SMT over identical M3 groups.</text>
  <text x="1546" y="58" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#596273" text-anchor="end">run m3-compare; n = 8 groups</text>
  <line x1="120" y1="680" x2="1160" y2="680" stroke="#e5e9ef" stroke-width="1"/>
  <text x="102" y="686" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#596273" text-anchor="end">0%</text>
  <line x1="120" y1="552.5" x2="1160" y2="552.5" stroke="#e5e9ef" stroke-width="1"/>
  <text x="102" y="558.5" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#596273" text-anchor="end">25%</text>
  <line x1="120" y1="425" x2="1160" y2="425" stroke="#e5e9ef" stroke-width="1"/>
  <text x="102" y="431" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#596273" text-anchor="end">50%</text>
  <line x1="120" y1="297.5" x2="1160" y2="297.5" stroke="#e5e9ef" stroke-width="1"/>
  <text x="102" y="303.5" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#596273" text-anchor="end">75%</text>
  <line x1="120" y1="170" x2="1160" y2="170" stroke="#e5e9ef" stroke-width="1"/>
  <text x="102" y="176" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#596273" text-anchor="end">100%</text>
  <line x1="120" y1="170" x2="120" y2="680" stroke="#c8d0da" stroke-width="2"/>
  <line x1="120" y1="680" x2="1160" y2="680" stroke="#c8d0da" stroke-width="2"/>
  <rect x="187" y="170" width="58" height="510" rx="3" fill="#b45c37" stroke="#b45c37" stroke-width="1"/>
  <text x="216" y="160" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#b45c37" text-anchor="middle">8/8</text>
  <rect x="255" y="170" width="58" height="510" rx="3" fill="#2f6b4f" stroke="#2f6b4f" stroke-width="1"/>
  <text x="284" y="160" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#2f6b4f" text-anchor="middle">8/8</text>
  <text x="172" y="714" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#111827" text-anchor="middle">Compile</text>
  <rect x="447" y="170" width="58" height="510" rx="3" fill="#b45c37" stroke="#b45c37" stroke-width="1"/>
  <text x="476" y="160" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#b45c37" text-anchor="middle">8/8</text>
  <rect x="515" y="170" width="58" height="510" rx="3" fill="#2f6b4f" stroke="#2f6b4f" stroke-width="1"/>
  <text x="544" y="160" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#2f6b4f" text-anchor="middle">8/8</text>
  <text x="432" y="714" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#111827" text-anchor="middle">Verdict</text>
  <rect x="707" y="170" width="58" height="510" rx="3" fill="#b45c37" stroke="#b45c37" stroke-width="1"/>
  <text x="736" y="160" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#b45c37" text-anchor="middle">8/8</text>
  <rect x="775" y="170" width="58" height="510" rx="3" fill="#2f6b4f" stroke="#2f6b4f" stroke-width="1"/>
  <text x="804" y="160" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#2f6b4f" text-anchor="middle">8/8</text>
  <text x="692" y="714" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#111827" text-anchor="middle">Conflict kind</text>
  <rect x="967" y="680" width="58" height="0" rx="3" fill="#b45c37" stroke="#b45c37" stroke-width="1"/>
  <text x="996" y="670" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#b45c37" text-anchor="middle">0/16</text>
  <rect x="1035" y="239.153" width="58" height="440.847" rx="3" fill="#2f6b4f" stroke="#2f6b4f" stroke-width="1"/>
  <text x="1064" y="229.153" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#2f6b4f" text-anchor="middle">51/59</text>
  <text x="952" y="714" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#111827" text-anchor="middle">Reuse</text>
  <rect x="1240" y="176" width="113.1" height="27" rx="12" fill="#fbfcfd" stroke="#b45c37" stroke-width="1"/>
  <text x="1252" y="194" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#b45c37" text-anchor="start">direct_rule</text>
  <rect x="1240" y="220" width="113.1" height="27" rx="12" fill="#fbfcfd" stroke="#2f6b4f" stroke-width="1"/>
  <text x="1252" y="238" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#2f6b4f" text-anchor="start">layered_ckc</text>
  <rect x="1220" y="300" width="325" height="380" rx="8" fill="#fbfcfd" stroke="#e5e9ef" stroke-width="2"/>
  <text x="1244" y="340" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#111827" text-anchor="start">Interpretation</text>
  <text x="1244" y="378" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#596273" text-anchor="start">Direct baseline verdict</text>
  <text x="1244" y="400" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#596273" text-anchor="start">accuracy is 8/8. Layered</text>
  <text x="1244" y="422" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#596273" text-anchor="start">verdict accuracy is 8/8;</text>
  <text x="1244" y="444" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#596273" text-anchor="start">layered-minus-direct verdict</text>
  <text x="1244" y="466" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#596273" text-anchor="start">delta is 0/1.</text>
  <text x="1244" y="500" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#596273" text-anchor="start">Component reuse delta is</text>
  <text x="1244" y="522" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#596273" text-anchor="start">51/59. This is deterministic</text>
  <text x="1244" y="544" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#596273" text-anchor="start">pipeline evidence and is</text>
  <text x="1244" y="566" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#596273" text-anchor="start">separate from model-route</text>
  <text x="1244" y="588" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#596273" text-anchor="start">lift.</text>
  <line x1="54" y1="844" x2="1546" y2="844" stroke="#e5e9ef" stroke-width="1"/>
  <text x="54" y="868" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#596273" text-anchor="start">Ranking: reuse_lift_only. Candidate diff compares 8 groups. No clinical, deployment, or regulatory claim is made.</text>
</svg>
