  <text x="102" y="303.5" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#596273" text-anchor="end">75%</text>
  <line x1="120" y1="170" x2="1160" y2="170" stroke="#e5e9ef" stroke-width="1"/>
  <text x="102" y="176" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#596273" text-anchor="end">100%</text>
