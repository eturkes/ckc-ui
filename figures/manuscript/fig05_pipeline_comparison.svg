  <text x="1160" y="271.014" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="14" font-weight="700" fill="#2f6b4f" text-anchor="middle">60/71</text>
  <rect x="1240" y="176" width="113.1" height="27" rx="12" fill="#fbfcfd" stroke="#b45c37" stroke-width="1"/>
  <text x="1252" y="194" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#b45c37" text-anchor="start">direct_rule</text>
  <rect x="1240" y="220" width="113.1" height="27" rx="12" fill="#fbfcfd" stroke="#2f6b4f" stroke-width="1"/>
  <text x="1252" y="238" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#2f6b4f" text-anchor="start">layered_ckc</text>
  <rect x="1220" y="300" width="325" height="380" rx="8" fill="#fbfcfd" stroke="#e5e9ef" stroke-width="2"/>
  <text x="1244" y="340" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#111827" text-anchor="start">Interpretation</text>
  <text x="1244" y="378" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#596273" text-anchor="start">Direct baseline verdict</text>
  <text x="1244" y="400" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#596273" text-anchor="start">accuracy is 10/10. Layered</text>
  <text x="1244" y="422" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#596273" text-anchor="start">verdict accuracy is 10/10;</text>
  <text x="1244" y="444" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#596273" text-anchor="start">layered-minus-direct verdict</text>
  <text x="1244" y="466" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#596273" text-anchor="start">delta is 0/1.</text>
  <text x="1244" y="500" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#596273" text-anchor="start">Component reuse delta is</text>
  <text x="1244" y="522" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#596273" text-anchor="start">60/71. This is deterministic</text>
  <text x="1244" y="544" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#596273" text-anchor="start">pipeline evidence and is</text>
  <text x="1244" y="566" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#596273" text-anchor="start">separate from model-route</text>
  <text x="1244" y="588" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#596273" text-anchor="start">baseline deltas.</text>
  <line x1="54" y1="844" x2="1546" y2="844" stroke="#e5e9ef" stroke-width="1"/>
  <text x="54" y="868" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#596273" text-anchor="start">Ranking: reuse_delta_only. Candidate diff compares 10 groups. No clinical, deployment, or regulatory claim is made.</text>
