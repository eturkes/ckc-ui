  <rect x="941" y="343.333" width="54" height="346.667" rx="3" fill="#1f6f8b" stroke="#1f6f8b" stroke-width="1"/>
  <text x="900" y="680" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#b45c37" text-anchor="middle">0/9</text>
  <text x="968" y="333.333" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1f6f8b" text-anchor="middle">6/9</text>
  <text x="848" y="724" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#111827" text-anchor="middle">wrong verdict</text>
  <rect x="1097" y="690" width="54" height="0" rx="3" fill="#b45c37" stroke="#b45c37" stroke-width="1"/>
  <rect x="1165" y="690" width="54" height="0" rx="3" fill="#1f6f8b" stroke="#1f6f8b" stroke-width="1"/>
  <text x="1124" y="680" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#b45c37" text-anchor="middle">0/9</text>
  <text x="1192" y="680" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1f6f8b" text-anchor="middle">0/9</text>
  <text x="1072" y="724" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#111827" text-anchor="middle">process</text>
  <rect x="1330" y="178" width="115.8" height="29" rx="12" fill="#fff0e8" stroke="#e5b69d" stroke-width="1"/>
