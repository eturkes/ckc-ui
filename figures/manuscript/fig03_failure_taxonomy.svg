  <text x="64" y="150" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#596273" text-anchor="start">row hits</text>
  <line x1="150" y1="170" x2="150" y2="690" stroke="#c8d0da" stroke-width="2"/>
