  <rect x="1330" y="220" width="106.62" height="29" rx="12" fill="#e8f5f8" stroke="#a9cfda" stroke-width="1"/>
  <text x="1342" y="240" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#1f6f8b" text-anchor="start">single_ir</text>
  <rect x="1310" y="300" width="230" height="238" rx="8" fill="#fbfcfd" stroke="#e5e9ef" stroke-width="2"/>
  <text x="1330" y="338" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#111827" text-anchor="start">Residual audit</text>
  <text x="1330" y="372" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#596273" text-anchor="start">Direct SMT: 9/9 rows</text>
  <text x="1330" y="394" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#596273" text-anchor="start">lacked named</text>
  <text x="1330" y="416" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#596273" text-anchor="start">assertions; exact</text>
  <text x="1330" y="438" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#596273" text-anchor="start">template matches</text>
  <text x="1330" y="460" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#596273" text-anchor="start">0/9.</text>
  <line x1="54" y1="844" x2="1546" y2="844" stroke="#e5e9ef" stroke-width="1"/>
  <text x="54" y="868" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#596273" text-anchor="start">Counts come from route_evaluation.route_category_counts. Categories can co-occur in one row, so columns are diagnostic burden rather than a partition of samples.</text>
</svg>
