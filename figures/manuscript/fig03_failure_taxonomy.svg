  <text x="296" y="680" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1f6f8b" text-anchor="middle">0/9</text>
  <text x="176" y="724" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#111827" text-anchor="middle">syntax</text>
  <rect x="425" y="516.667" width="54" height="173.333" rx="3" fill="#b45c37" stroke="#b45c37" stroke-width="1"/>
  <rect x="493" y="170" width="54" height="520" rx="3" fill="#1f6f8b" stroke="#1f6f8b" stroke-width="1"/>
  <text x="452" y="506.667" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#b45c37" text-anchor="middle">3/9</text>
  <text x="520" y="160" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1f6f8b" text-anchor="middle">9/9</text>
  <text x="400" y="724" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#111827" text-anchor="middle">grounding</text>
  <rect x="649" y="516.667" width="54" height="173.333" rx="3" fill="#b45c37" stroke="#b45c37" stroke-width="1"/>
  <rect x="717" y="690" width="54" height="0" rx="3" fill="#1f6f8b" stroke="#1f6f8b" stroke-width="1"/>
  <text x="676" y="506.667" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#b45c37" text-anchor="middle">3/9</text>
  <text x="744" y="680" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1f6f8b" text-anchor="middle">0/9</text>
  <text x="624" y="724" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#111827" text-anchor="middle">unsupported schema</text>
