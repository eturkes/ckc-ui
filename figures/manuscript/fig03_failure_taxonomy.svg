<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Failure taxonomy by route</title>
  <desc id="desc">Diagnostic row-category hits show direct SMT failing mainly at target syntax, while single-IR produces syntactic targets that are rejected by grounding and wrong-verdict checks.</desc>
  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="54" y="58" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#111827" text-anchor="start">Failure taxonomy by route</text>
  <text x="54" y="92" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#596273" text-anchor="start">Diagnostic categories are non-exclusive row hits over nine route rows.</text>
  <text x="1546" y="58" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#596273" text-anchor="end">row-category hits</text>
  <line x1="150" y1="690" x2="1270" y2="690" stroke="#e5e9ef" stroke-width="1"/>
  <text x="132" y="696" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#596273" text-anchor="end">0</text>
  <line x1="150" y1="516.667" x2="1270" y2="516.667" stroke="#e5e9ef" stroke-width="1"/>
  <text x="132" y="522.667" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#596273" text-anchor="end">3</text>
  <line x1="150" y1="343.333" x2="1270" y2="343.333" stroke="#e5e9ef" stroke-width="1"/>
  <text x="132" y="349.333" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#596273" text-anchor="end">6</text>
  <line x1="150" y1="170" x2="1270" y2="170" stroke="#e5e9ef" stroke-width="1"/>
  <text x="132" y="176" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#596273" text-anchor="end">9</text>
  <text x="64" y="150" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#596273" text-anchor="start">row hits</text>
  <line x1="150" y1="170" x2="150" y2="690" stroke="#c8d0da" stroke-width="2"/>
  <line x1="150" y1="690" x2="1270" y2="690" stroke="#c8d0da" stroke-width="2"/>
  <rect x="201" y="343.333" width="54" height="346.667" rx="3" fill="#b45c37" stroke="#b45c37" stroke-width="1"/>
  <rect x="269" y="690" width="54" height="0" rx="3" fill="#1f6f8b" stroke="#1f6f8b" stroke-width="1"/>
