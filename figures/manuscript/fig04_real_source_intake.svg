  <text x="538" y="456" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#596273" text-anchor="start">7 quoted candidate</text>
  <text x="538" y="479" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#596273" text-anchor="start">regions.</text>
  <text x="538" y="502" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#596273" text-anchor="start">Machine hints seed</text>
  <text x="538" y="525" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#596273" text-anchor="start">provisional rows.</text>
  <rect x="910" y="390" width="260" height="155" rx="8" fill="#ffffff" stroke="#2f6b4f" stroke-width="3"/>
  <text x="928" y="422" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111827" text-anchor="start">Candidate IR</text>
  <text x="928" y="456" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#596273" text-anchor="start">4 candidate route-rule</text>
  <text x="928" y="479" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#596273" text-anchor="start">rows.</text>
  <text x="928" y="502" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#596273" text-anchor="start">Rows are not</text>
  <text x="928" y="525" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#596273" text-anchor="start">solver-score evidence.</text>
  <rect x="1300" y="390" width="230" height="155" rx="8" fill="#ffffff" stroke="#9d3b3b" stroke-width="3"/>
  <text x="1318" y="422" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111827" text-anchor="start">Gate</text>
  <text x="1318" y="456" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#596273" text-anchor="start">6 blocking residuals.</text>
  <text x="1318" y="479" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#596273" text-anchor="start">Scope: none.</text>
