<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Real guideline intake scope</title>
  <desc id="desc">Real Japanese guideline sources are represented as candidate-only source-intake artifacts with source and permission hashes, but they remain outside locked M1/M2 scoring and carry no clinical claim.</desc>
  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="54" y="58" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#111827" text-anchor="start">Real guideline intake scope</text>
  <text x="54" y="92" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#596273" text-anchor="start">Public-source rows are candidate-only artifacts outside locked M1/M2 scoring.</text>
  <text x="1546" y="58" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#596273" text-anchor="end">no clinical claim</text>
  <rect x="70" y="150" width="210" height="130" rx="8" fill="#ffffff" stroke="#355c9a" stroke-width="3"/>
  <text x="94" y="210" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#355c9a" text-anchor="start">2</text>
  <text x="94" y="244" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#111827" text-anchor="start">Sources</text>
  <rect x="316" y="150" width="210" height="130" rx="8" fill="#ffffff" stroke="#1f6f8b" stroke-width="3"/>
  <text x="340" y="210" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#1f6f8b" text-anchor="start">7</text>
  <text x="340" y="244" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#111827" text-anchor="start">Candidate spans</text>
  <rect x="562" y="150" width="210" height="130" rx="8" fill="#ffffff" stroke="#2f6b4f" stroke-width="3"/>
  <text x="586" y="210" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#2f6b4f" text-anchor="start">4</text>
  <text x="586" y="244" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#111827" text-anchor="start">Candidate rules</text>
  <rect x="808" y="150" width="210" height="130" rx="8" fill="#ffffff" stroke="#b45c37" stroke-width="3"/>
  <text x="832" y="210" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#b45c37" text-anchor="start">3</text>
  <text x="832" y="244" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#111827" text-anchor="start">Rejected spans</text>
  <rect x="1054" y="150" width="210" height="130" rx="8" fill="#ffffff" stroke="#8a5b00" stroke-width="3"/>
  <text x="1078" y="210" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#8a5b00" text-anchor="start">20</text>
  <text x="1078" y="244" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#111827" text-anchor="start">Residuals</text>
  <rect x="1300" y="150" width="210" height="130" rx="8" fill="#ffffff" stroke="#9d3b3b" stroke-width="3"/>
  <text x="1324" y="210" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#9d3b3b" text-anchor="start">6</text>
  <text x="1324" y="244" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#111827" text-anchor="start">Blocking</text>
  <text x="1324" y="266" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#111827" text-anchor="start">residuals</text>
  <rect x="130" y="390" width="260" height="155" rx="8" fill="#ffffff" stroke="#355c9a" stroke-width="3"/>
  <text x="148" y="422" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111827" text-anchor="start">Registry</text>
  <text x="148" y="456" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#596273" text-anchor="start">2 public source records.</text>
  <text x="148" y="479" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#596273" text-anchor="start">Source and permission</text>
  <text x="148" y="502" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#596273" text-anchor="start">hashes are retained.</text>
  <rect x="520" y="390" width="260" height="155" rx="8" fill="#ffffff" stroke="#1f6f8b" stroke-width="3"/>
