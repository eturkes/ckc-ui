  <polygon points="520,468 509.608,474 509.608,462" fill="#596273" stroke="none"/>
  <line x1="780" y1="468" x2="910" y2="468" stroke="#596273" stroke-width="2"/>
  <polygon points="910,468 899.608,474 899.608,462" fill="#596273" stroke="none"/>
  <line x1="1170" y1="468" x2="1300" y2="468" stroke="#596273" stroke-width="2"/>
  <polygon points="1300,468 1289.608,474 1289.608,462" fill="#596273" stroke="none"/>
  <rect x="135" y="640" width="1330" height="130" rx="8" fill="#fbfcfd" stroke="#e5e9ef" stroke-width="2"/>
  <text x="159" y="678" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111827" text-anchor="start">Per-source candidate coverage</text>
  <text x="159" y="710" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#596273" text-anchor="start">source</text>
  <text x="925" y="710" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#596273" text-anchor="start">spans</text>
  <text x="1065" y="710" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#596273" text-anchor="start">rules</text>
  <text x="1205" y="710" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#596273" text-anchor="start">rejected</text>
  <text x="1345" y="710" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#596273" text-anchor="start">raw cache</text>
  <text x="159" y="738" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="14" font-weight="400" fill="#111827" text-anchor="start">real.jstage.thyroid_tumor_2024.cq_recommendations</text>
  <text x="925" y="738" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#111827" text-anchor="start">4</text>
  <text x="1065" y="738" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#111827" text-anchor="start">4</text>
  <text x="1205" y="738" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#111827" text-anchor="start">0</text>
  <text x="1345" y="738" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#111827" text-anchor="start">complete</text>
  <text x="159" y="766" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="14" font-weight="400" fill="#111827" text-anchor="start">real.jstage.sepsis_dic_2025.guideline_article</text>
  <text x="925" y="766" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#111827" text-anchor="start">3</text>
