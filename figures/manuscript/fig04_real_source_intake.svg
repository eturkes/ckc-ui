  <line x1="54" y1="844" x2="1546" y2="844" stroke="#e5e9ef" stroke-width="1"/>
  <text x="54" y="868" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#596273" text-anchor="start">Scoring scope: not_in_locked_m1_m2_measurement. These rows are source-intake candidate evidence only and are excluded from M1/M2 route metrics.</text>
</svg>
