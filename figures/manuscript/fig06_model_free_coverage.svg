<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Model-free coverage</title>
  <desc id="desc">Model-free coverage. Build-set mappings are applied to fresh synthetic fixture groups with runtime AI disabled; component coverage, verdict accuracy, and zero apply-phase model calls are reported as exact ratios/counts.</desc>
  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="54" y="58" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#111827" text-anchor="start">Model-free coverage</text>
  <text x="54" y="92" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#596273" text-anchor="start">Build-set mappings are applied to fresh fixture groups with runtime AI disabled.</text>
  <text x="1546" y="58" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#596273" text-anchor="end">run m3-coverage</text>
  <rect x="70" y="145" width="315" height="185" rx="8" fill="#ffffff" stroke="#355c9a" stroke-width="3"/>
  <text x="88" y="177" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111827" text-anchor="start">Build set</text>
  <rect x="297" y="159" width="67.2" height="28" rx="12" fill="#eef3fb" stroke="#b8c8e6" stroke-width="1"/>
  <text x="309" y="178" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#355c9a" text-anchor="start">admit</text>
  <text x="88" y="211" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#596273" text-anchor="start">2 group(s), 3 fixture(s).</text>
  <text x="88" y="234" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#596273" text-anchor="start">Mapping-set size: 12.</text>
  <rect x="470" y="145" width="315" height="185" rx="8" fill="#ffffff" stroke="#2f6b4f" stroke-width="3"/>
  <text x="488" y="177" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111827" text-anchor="start">Component store</text>
  <rect x="703" y="159" width="58.56" height="28" rx="12" fill="#eaf4ee" stroke="#b9d6c5" stroke-width="1"/>
  <text x="715" y="178" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#2f6b4f" text-anchor="start">hash</text>
  <text x="488" y="211" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#596273" text-anchor="start">Reusable hashes from the build</text>
  <text x="488" y="234" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#596273" text-anchor="start">phase form the apply-phase</text>
  <text x="488" y="257" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#596273" text-anchor="start">mapping surface.</text>
  <text x="488" y="280" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#596273" text-anchor="start">Coverage target: 35/36.</text>
  <line x1="385" y1="238" x2="470" y2="238" stroke="#596273" stroke-width="2"/>
  <polygon points="470,238 459.608,244 459.608,232" fill="#596273" stroke="none"/>
  <rect x="870" y="145" width="315" height="185" rx="8" fill="#ffffff" stroke="#1f6f8b" stroke-width="3"/>
  <text x="888" y="177" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111827" text-anchor="start">Apply set</text>
  <rect x="1097" y="159" width="75.84" height="28" rx="12" fill="#e8f5f8" stroke="#a9cfda" stroke-width="1"/>
  <text x="1109" y="178" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1f6f8b" text-anchor="start">AI off</text>
  <text x="888" y="211" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#596273" text-anchor="start">3 fresh group(s), 5</text>
  <text x="888" y="234" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#596273" text-anchor="start">fixture(s).</text>
  <text x="888" y="257" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#596273" text-anchor="start">Apply-phase model calls: 0.</text>
  <line x1="785" y1="238" x2="870" y2="238" stroke="#596273" stroke-width="2"/>
  <polygon points="870,238 859.608,244 859.608,232" fill="#596273" stroke="none"/>
  <rect x="1270" y="145" width="260" height="185" rx="8" fill="#ffffff" stroke="#c8d0da" stroke-width="3"/>
  <text x="1288" y="177" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111827" text-anchor="start">Gold check</text>
  <rect x="1444" y="159" width="75.84" height="28" rx="12" fill="#f5f7fa" stroke="#c8d0da" stroke-width="1"/>
  <text x="1456" y="178" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#596273" text-anchor="start">verify</text>
  <text x="1288" y="211" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#596273" text-anchor="start">Verdict accuracy: 3/3.</text>
  <text x="1288" y="234" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#596273" text-anchor="start">Conflict-kind accuracy:</text>
  <text x="1288" y="257" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#596273" text-anchor="start">3/3.</text>
  <line x1="1185" y1="238" x2="1270" y2="238" stroke="#596273" stroke-width="2"/>
  <polygon points="1270,238 1259.608,244 1259.608,232" fill="#596273" stroke="none"/>
  <line x1="140" y1="695" x2="1010" y2="695" stroke="#e5e9ef" stroke-width="1"/>
  <text x="122" y="701" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#596273" text-anchor="end">0%</text>
  <line x1="140" y1="632.5" x2="1010" y2="632.5" stroke="#e5e9ef" stroke-width="1"/>
  <text x="122" y="638.5" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#596273" text-anchor="end">25%</text>
  <line x1="140" y1="570" x2="1010" y2="570" stroke="#e5e9ef" stroke-width="1"/>
  <text x="122" y="576" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#596273" text-anchor="end">50%</text>
  <line x1="140" y1="507.5" x2="1010" y2="507.5" stroke="#e5e9ef" stroke-width="1"/>
  <text x="122" y="513.5" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#596273" text-anchor="end">75%</text>
  <line x1="140" y1="445" x2="1010" y2="445" stroke="#e5e9ef" stroke-width="1"/>
  <text x="122" y="451" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#596273" text-anchor="end">100%</text>
  <line x1="140" y1="445" x2="140" y2="695" stroke="#e5e9ef" stroke-width="1" stroke-dasharray="2 10"/>
  <line x1="140" y1="695" x2="140" y2="703" stroke="#c8d0da" stroke-width="2"/>
  <text x="140" y="729" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#111827" text-anchor="middle">Component coverage</text>
  <line x1="575" y1="445" x2="575" y2="695" stroke="#e5e9ef" stroke-width="1" stroke-dasharray="2 10"/>
  <line x1="575" y1="695" x2="575" y2="703" stroke="#c8d0da" stroke-width="2"/>
  <text x="575" y="729" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#111827" text-anchor="middle">Verdict accuracy</text>
  <line x1="1010" y1="445" x2="1010" y2="695" stroke="#e5e9ef" stroke-width="1" stroke-dasharray="2 10"/>
  <line x1="1010" y1="695" x2="1010" y2="703" stroke="#c8d0da" stroke-width="2"/>
  <text x="1010" y="729" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#111827" text-anchor="middle">Kind accuracy</text>
  <text x="54" y="425" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#596273" text-anchor="start">rate</text>
  <line x1="140" y1="445" x2="140" y2="695" stroke="#c8d0da" stroke-width="2"/>
  <line x1="140" y1="695" x2="1010" y2="695" stroke="#c8d0da" stroke-width="2"/>
  <line x1="140" y1="451.944" x2="575" y2="445" stroke="#2f6b4f" stroke-width="3"/>
  <line x1="575" y1="445" x2="1010" y2="445" stroke="#2f6b4f" stroke-width="3"/>
  <polygon points="140,445.944 146,451.944 140,457.944 134,451.944" fill="#2f6b4f" stroke="none"/>
  <text x="140" y="471.944" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="14" font-weight="700" fill="#2f6b4f" text-anchor="middle">35/36</text>
  <polygon points="575,439 581,445 575,451 569,445" fill="#2f6b4f" stroke="none"/>
  <text x="575" y="465" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="14" font-weight="700" fill="#2f6b4f" text-anchor="middle">3/3</text>
  <polygon points="1010,439 1016,445 1010,451 1004,445" fill="#2f6b4f" stroke="none"/>
  <text x="1010" y="465" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="14" font-weight="700" fill="#2f6b4f" text-anchor="middle">3/3</text>
  <rect x="1090" y="420" width="435" height="315" rx="8" fill="#fbfcfd" stroke="#e5e9ef" stroke-width="2"/>
  <text x="1115" y="462" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#111827" text-anchor="start">Apply rows</text>
  <text x="1115" y="505" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="15" font-weight="400" fill="#111827" text-anchor="start">m2_holdout_conflict</text>
  <text x="1400" y="505" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#596273" text-anchor="end">12/12 components</text>
  <text x="1115" y="550" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="15" font-weight="400" fill="#111827" text-anchor="start">m3_metamorphic_conflict</text>
  <text x="1400" y="550" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#596273" text-anchor="end">12/12 components</text>
  <text x="1115" y="595" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="15" font-weight="400" fill="#111827" text-anchor="start">m3_exception_resolved</text>
  <text x="1400" y="595" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#596273" text-anchor="end">11/12 components</text>
  <text x="1115" y="700" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#596273" text-anchor="start">The model-per-document baseline would make</text>
  <text x="1115" y="722" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#596273" text-anchor="start">5 apply calls; this run makes zero</text>
  <text x="1115" y="744" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#596273" text-anchor="start">apply-phase model calls.</text>
  <line x1="54" y1="844" x2="1546" y2="844" stroke="#e5e9ef" stroke-width="1"/>
  <text x="54" y="868" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#596273" text-anchor="start">Scope: model-free coverage over synthetic fixtures; no clinical, deployment, or regulatory claim is made.</text>
</svg>
