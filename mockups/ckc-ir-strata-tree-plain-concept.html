<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CKC Plain-Language Strata Tree Concept</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f4;
      --surface: #ffffff;
      --ink: #17211d;
      --muted: #65736a;
      --line: #d7ded7;
      --source: #2d7074;
      --piece: #4f7330;
      --meaning: #7b4b78;
      --claim: #2f6695;
      --rule: #9a5b15;
      --check: #344f7e;
      --trail: #a84034;
      --shortcut: #85621f;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.35;
    }

    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 36px;
    }

    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: end;
      margin-bottom: 16px;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0;
    }

    h1 {
      margin: 0;
      max-width: 800px;
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1;
      letter-spacing: 0;
    }

    .key {
      display: grid;
      grid-template-columns: repeat(4, auto);
      gap: 7px;
      justify-content: end;
    }

    .key span {
      display: inline-grid;
      grid-template-columns: 14px auto;
      gap: 6px;
      align-items: center;
      padding: 5px 7px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.82);
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }

    .swatch {
      width: 13px;
      height: 13px;
      border: 1px solid currentColor;
      background: currentColor;
      opacity: 0.18;
    }

    .k-source {
      color: var(--source);
      border-radius: 4px;
    }

    .k-meaning {
      color: var(--meaning);
      transform: rotate(45deg) scale(0.82);
    }

    .k-rule {
      color: var(--rule);
      clip-path: polygon(50% 0, 96% 28%, 96% 72%, 50% 100%, 4% 72%, 4% 28%);
    }

    .k-check {
      color: var(--check);
      border-radius: 2px;
    }

    .frame {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 1px 2px rgba(23, 33, 29, 0.07), 0 18px 42px rgba(23, 33, 29, 0.08);
      overflow: hidden;
    }

    .caption {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-top: 1px solid var(--line);
      background: #fbfcfa;
      color: var(--muted);
      font-size: 12px;
    }

    .caption code {
      color: var(--ink);
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0;
    }

    .scroll {
      overflow: auto;
    }

    svg.diagram {
      display: block;
      width: 1100px;
      height: 760px;
      background: #fbfcfa;
    }

    .band-label {
      fill: #65736a;
      font: 700 12px var(--sans);
      letter-spacing: 0;
    }

    .node-label {
      fill: #17211d;
      font: 700 13px var(--sans);
      letter-spacing: 0;
    }

    .node-sub {
      fill: #65736a;
      font: 11px var(--sans);
      letter-spacing: 0;
    }

    .wire {
      fill: none;
      stroke: #8ca093;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .wire.reuse {
      stroke: #5c916a;
      stroke-width: 3.2;
    }

    .wire.shortcut {
      stroke: #bd944a;
      stroke-dasharray: 9 8;
      stroke-width: 2.4;
    }

    .node-card {
      fill: #ffffff;
      stroke: #cfd9cf;
      stroke-width: 1;
      rx: 8;
    }

    .source-shape {
      fill: #e0f0ef;
      stroke: var(--source);
    }

    .piece-shape {
      fill: #e6f1df;
      stroke: var(--piece);
    }

    .meaning-shape {
      fill: #f0e5ef;
      stroke: var(--meaning);
    }

    .claim-shape {
      fill: #e2edf7;
      stroke: var(--claim);
    }

    .rule-shape {
      fill: #f6ead7;
      stroke: var(--rule);
    }

    .check-shape {
      fill: #e4ecf7;
      stroke: var(--check);
    }

    .trail-shape {
      fill: #f7e3df;
      stroke: var(--trail);
    }

    .shortcut-shape {
      fill: #fbf0d5;
      stroke: var(--shortcut);
      stroke-dasharray: 5 4;
    }

    .glyph {
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @media (max-width: 860px) {
      header {
        grid-template-columns: 1fr;
      }

      .key {
        justify-content: start;
      }

      .caption {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div>
        <p class="eyebrow">concept 03b / plain-language labels</p>
        <h1>Layered evidence tree with plain labels</h1>
      </div>
      <div class="key" aria-label="Symbol legend">
        <span><i class="swatch k-source"></i>source</span>
        <span><i class="swatch k-meaning"></i>meaning</span>
        <span><i class="swatch k-rule"></i>rule</span>
        <span><i class="swatch k-check"></i>check</span>
      </div>
    </header>

    <section class="frame" aria-labelledby="diagramTitle">
      <div class="scroll">
        <svg class="diagram" viewBox="0 0 1100 760" role="img" aria-labelledby="diagramTitle diagramDesc">
          <title id="diagramTitle">Layered evidence tree with plain labels</title>
          <desc id="diagramDesc">A plain-language tree diagram showing how a source passage becomes text pieces, shared meaning, a reusable rule, a machine check, and an audit trail. Shapes encode component categories.</desc>

          <rect x="0" y="0" width="1100" height="760" fill="#fbfcfa"></rect>
          <rect x="38" y="62" width="1024" height="88" fill="#eef5f3" stroke="#d7ded7"></rect>
          <rect x="38" y="170" width="1024" height="88" fill="#f1f6ed" stroke="#d7ded7"></rect>
          <rect x="38" y="278" width="1024" height="118" fill="#f4f1f7" stroke="#d7ded7"></rect>
          <rect x="38" y="416" width="1024" height="112" fill="#fbf4e8" stroke="#d7ded7"></rect>
          <rect x="38" y="548" width="1024" height="112" fill="#eef2f8" stroke="#d7ded7"></rect>
          <rect x="38" y="680" width="1024" height="44" fill="#fbf0ee" stroke="#d7ded7"></rect>

          <text class="band-label" x="58" y="88">Original text</text>
          <text class="band-label" x="58" y="196">Text pieces</text>
          <text class="band-label" x="58" y="304">Meaning</text>
          <text class="band-label" x="58" y="442">Shared rules</text>
          <text class="band-label" x="58" y="574">Machine checks</text>
          <text class="band-label" x="58" y="706">Audit trail</text>

          <path class="wire reuse" d="M252 106 C310 106 320 214 380 214"></path>
          <path class="wire reuse" d="M252 106 C342 108 404 220 540 220"></path>
          <path class="wire reuse" d="M524 214 C575 214 578 326 624 326"></path>
          <path class="wire reuse" d="M656 220 C724 232 754 354 786 354"></path>
          <path class="wire reuse" d="M748 326 C792 326 802 468 846 468"></path>
          <path class="wire reuse" d="M948 354 C978 374 964 468 846 468"></path>
          <path class="wire reuse" d="M970 468 C1018 468 1016 604 970 604"></path>
          <path class="wire reuse" d="M858 604 C756 604 724 704 612 704"></path>

          <path class="wire" d="M656 220 C610 276 598 512 636 512"></path>
          <path class="wire" d="M760 512 C813 512 832 604 858 604"></path>
          <path class="wire shortcut" d="M252 106 C402 122 486 603 636 604"></path>
          <path class="wire shortcut" d="M760 604 C812 648 868 650 930 704"></path>

          <g transform="translate(120 78)">
            <rect class="node-card" x="0" y="0" width="132" height="56"></rect>
            <path class="source-shape glyph" d="M17 13h18l8 8v24H17z"></path>
            <path class="source-shape glyph" d="M35 13v9h8"></path>
            <text class="node-label" x="54" y="24">warning text</text>
            <text class="node-sub" x="54" y="42">source passage</text>
          </g>

          <g transform="translate(380 186)">
            <rect class="node-card" x="0" y="0" width="144" height="56"></rect>
            <rect class="piece-shape" x="16" y="13" width="30" height="30" rx="15"></rect>
            <path class="glyph" stroke="#4f7330" d="M24 20v16M38 20v16M24 24h14M24 34h14"></path>
            <text class="node-label" x="58" y="24">picked text</text>
            <text class="node-sub" x="58" y="42">recommendation</text>
          </g>

          <g transform="translate(540 192)">
            <rect class="node-card" x="0" y="0" width="116" height="56"></rect>
            <rect class="piece-shape" x="16" y="13" width="30" height="30" rx="15"></rect>
            <path class="glyph" stroke="#4f7330" d="M24 20v16M38 20v16M24 24h14M24 34h14"></path>
            <text class="node-label" x="58" y="24">same idea</text>
            <text class="node-sub" x="58" y="42">wording variant</text>
          </g>

          <g transform="translate(624 298)">
            <rect class="node-card" x="0" y="0" width="150" height="56"></rect>
            <path class="meaning-shape" d="M31 12l20 18-20 18-20-18z"></path>
            <path class="glyph" stroke="#7b4b78" d="M23 30h16"></path>
            <text class="node-label" x="62" y="24">patient group</text>
            <text class="node-sub" x="62" y="42">severe kidney issue</text>
          </g>

          <g transform="translate(786 326)">
            <rect class="node-card" x="0" y="0" width="162" height="56"></rect>
            <rect class="claim-shape" x="16" y="13" width="32" height="24" rx="6"></rect>
            <path class="glyph" stroke="#2f6695" d="M23 21h18M23 29h12M25 37l-8 8v-8"></path>
            <text class="node-label" x="62" y="24">claim</text>
            <text class="node-sub" x="62" y="42">who and what</text>
          </g>

          <g transform="translate(636 484)">
            <rect class="node-card" x="0" y="0" width="124" height="56"></rect>
            <rect class="shortcut-shape" x="16" y="13" width="30" height="30" rx="2"></rect>
            <path class="glyph" stroke="#85621f" d="M22 21h18M22 30h18M22 39h10"></path>
            <text class="node-label" x="58" y="24">shortcut</text>
            <text class="node-sub" x="58" y="42">text to check</text>
          </g>

          <g transform="translate(846 440)">
            <rect class="node-card" x="0" y="0" width="124" height="56"></rect>
            <path class="rule-shape" d="M31 10l24 14v28L31 66 7 52V24z" transform="scale(.62) translate(18 2)"></path>
            <path class="glyph" stroke="#9a5b15" d="M31 18v26M21 24h20M23 24l-6 14h12M39 24l-6 14h12"></path>
            <text class="node-label" x="58" y="24">shared rule</text>
            <text class="node-sub" x="58" y="42">reused by variants</text>
          </g>

          <g transform="translate(858 576)">
            <rect class="node-card" x="0" y="0" width="112" height="56"></rect>
            <rect class="check-shape" x="18" y="14" width="28" height="28" rx="2"></rect>
            <path class="glyph" stroke="#344f7e" d="M24 8v6M40 8v6M24 42v6M40 42v6M12 22h6M46 22h6M12 34h6M46 34h6"></path>
            <text class="node-label" x="58" y="24">check</text>
            <text class="node-sub" x="58" y="42">ready to test</text>
          </g>

          <g transform="translate(930 676)">
            <rect class="node-card" x="0" y="0" width="112" height="40"></rect>
            <rect class="shortcut-shape" x="16" y="8" width="24" height="24" rx="2"></rect>
            <text class="node-label" x="52" y="24">drift</text>
          </g>

          <g transform="translate(500 676)">
            <rect class="node-card" x="0" y="0" width="112" height="40"></rect>
            <path class="trail-shape" d="M30 8a12 12 0 0 1 12 12c0 9-12 18-12 18S18 29 18 20A12 12 0 0 1 30 8z"></path>
            <circle cx="30" cy="20" r="2" fill="#a84034"></circle>
            <text class="node-label" x="52" y="24">audit trail</text>
          </g>
        </svg>
      </div>
      <div class="caption">
        <span>Green branches show parts that stay the same across wording changes; dashed amber shows the shortcut path.</span>
        <code>source -> pieces -> meaning -> rules -> checks -> audit trail</code>
      </div>
    </section>
  </div>
</body>
</html>
